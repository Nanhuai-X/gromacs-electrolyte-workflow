run_target: REMOTE_SERVER
hostname: "server.example.org"
ssh_port: 22
username: "your_username"
private_key_path: "C:/Users/you/.ssh/id_ed25519"
known_hosts_path: "C:/Users/you/.ssh/known_hosts"
remote_workdir: "/path/to/cp2k-workdir"
scheduler:
  name: SLURM
  account: null
  partition: null
  gpu_constraint: null
  cp2k_executable: null
security:
  strict_host_key_checking: true
  secret_content_collected: false
