name: RESP2
status: VALIDATED_SINGLE_AND_MULTI_CONFORMER_WITH_LIMITATIONS
description: Same-geometry gas/CPCM-water Native Multiwfn RESP2 implementation; delta remains an explicit sourced choice, not a universal default.
source: https://doi.org/10.1038/s42004-020-0291-4
gas_profile: resp2_delta_0p5.yaml
solvent_profile: resp2_delta_0p5.yaml
delta: 0.5
formula: q_resp2 = (1-delta) * q_gas + delta * q_solv
requirements:
  same_geometry: true
  same_atom_mapping: true
  validated_software_implementation: true
  single_conformer_only: false
  multi_conformer_status: SUPPORTED_EQUAL_WEIGHT_COMMON_CHARGE_PROTOCOL
  boltzmann_weighting_status: NOT_YET_VALIDATED_OPTIONAL_NONSTANDARD_EXTENSION
  no_renormalization: true
  no_ionic_scaling: true
