registry_version: 1
policy: Exact local Multiwfn version, update date, and a fresh FCHK fixture are required before native RESP automation is enabled.
source:
  manual_title: Multiwfn 3.8 Software Manual
  section: 3.9.16 Restrained ElectroStatic Potential (RESP) atomic charge (18)
  official_download_page: https://www.umsyar.com/multiwfn/download.html
  manual_url: https://www.umsyar.com/multiwfn/misc/Multiwfn_3.8_dev.pdf
  bayly_doi: https://doi.org/10.1021/j100142a004
versions:
  - multiwfn_version: 3.8_dev
    update_date: 2025-Oct-2
    executable_family: Multiwfn_3.8_dev_bin_Win64
    main_menu_path:
      - "7"
    resp_menu_path:
      - "7"
      - "18"
    standard_two_stage_option: "1"
    one_stage_option: "2"
    stdin_sequence:
      initial_enter: true
      standard_two_stage:
        - "7"
        - "18"
        - "1"
        - "y"
        - "0"
        - "0"
        - "q"
      one_stage_diagnostic:
        - "7"
        - "18"
        - "2"
        - "y"
        - "0"
        - "0"
        - "q"
      resp2_two_stage:
        - "7"
        - "18"
        - "4"
        - "3"
        - "0.005"
        - "4"
        - "0.01"
        - "0"
        - "1"
        - "y"
        - "0"
        - "0"
        - "q"
    input_requirements:
      file_type: FCHK_with_GTF_information
      formal_charge: Read from wavefunction; standard menu does not prompt for a separate total charge
      multiplicity: Read from wavefunction
      settings: MULTIWFNPATH must point to the directory containing settings.ini
    stage_1:
      description: All atoms are fitted with weak hyperbolic restraint; runtime reports no atom equivalence constraint.
      restraint_a: 0.0005
      restraint_b: 0.1
      restrained_atoms: non-hydrogen atoms
      charge_constraint_runtime: No charge constraint is imposed in this stage
      convergence_tolerance: 0.000001
      initial_charge_runtime: zero
    stage_2:
      description: Standard RESP second stage; non-target atoms remain at stage-1 values.
      restraint_a: 0.001
      restraint_b: 0.1
      fitted_objects_runtime: sp3 carbons, methyl carbons, and hydrogens attached to them
      equivalence_runtime: H atoms within each CH3, CH2, and =CH2 group are equivalent by default
      charge_constraint_runtime: No separate charge prompt observed; total charge is checked from output
      water_behavior: skipped when no atom needs fitting
    resp2_two_stage:
      restraint_a_stage1: 0.005
      restraint_a_stage2: 0.01
      setting_menu_path: 4 -> 3/value, 4/value, 0
      validated_fixture: water_final/resp_sp.fchk
    fitting_points:
      default_method: MK
      radius_mode: Automatic
      runtime_water_points: 2933
      runtime_methanol_points: 4866
      runtime_water_radii_angstrom: H=1.200; O=1.400
      runtime_methanol_radii_angstrom: H=1.200; C=1.500; O=1.400
      esp_type: Nuclear + Electronic
      cubegen_fallback: Internal Multiwfn ESP evaluation when cubegen is unavailable
    output:
      charge_file: resp_sp.chg
      columns: name, X, Y, Z, charge
      stdout_contains: Stage markers, convergence, charge sum, RMSE/RRMSE
    tested: true
    tested_fixtures:
      - water_final/resp_sp.fchk
      - methanol_final/resp_sp.fchk
    native_resp_sequence_validated: true
